<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEV Analytics — Enterprise Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── Reset & Base (preserved) ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #F5F4F1;
  --surface:  #FFFFFF;
  --surface2: #F0EEE9;
  --surface3: #E8E6E0;
  --border:   #DDD9D0;
  --border2:  #C8C4BB;
  --text:     #1A1917;
  --text2:    #5C5A55;
  --text3:    #9A9690;
  --blue:     #1B5FCC;
  --blue-bg:  #EBF1FB;
  --blue-txt: #1B4FA0;
  --green:    #1A7A45;
  --green-bg: #E6F5ED;
  --green-txt:#145E35;
  --red:      #C0392B;
  --red-bg:   #FAEAE8;
  --red-txt:  #9B2B20;
  --amber:    #B45309;
  --amber-bg: #FEF3C7;
  --amber-txt:#92400E;
  --purple:   #5B3FA8;
  --purple-bg:#F0ECFB;
  --purple-txt:#3D2880;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow:    0 4px 16px rgba(0,0,0,.07), 0 1px 4px rgba(0,0,0,.04);
  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 14px;
  --font: 'DM Sans', system-ui, sans-serif;
  --mono: 'DM Mono', monospace;
  --transition: .18s ease;
}
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 14px; }
.logo {
  display: flex; align-items: center; gap: 8px;
  font-weight: 600; font-size: 15px; color: var(--text);
  letter-spacing: -.02em;
}
.logo-mark {
  width: 28px; height: 28px; background: var(--text);
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
}
.logo-mark span { color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .05em; }
.topbar-divider { width: 1px; height: 20px; background: var(--border); }
.breadcrumb { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text3); }
.breadcrumb a { color: var(--blue); cursor: pointer; text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.role-selector {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font);
}
.role-selector:hover { background: var(--surface3); }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--blue); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
}
.refresh-time { font-size: 11px; color: var(--text3); font-family: var(--mono); }
.icon-btn {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text2);
  position: relative;
}
.notif-dot { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--red); border: 1.5px solid var(--surface); }
.filters-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 42px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  overflow-x: auto;
}
.filter-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.chip {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; padding: 4px 10px;
  border: 1px solid var(--border); border-radius: 20px;
  cursor: pointer; background: var(--surface); color: var(--text2);
  white-space: nowrap;
}
.chip.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue-txt); font-weight: 500; }
.filter-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
.screens { flex: 1; overflow: hidden; position: relative; }
.screen {
  position: absolute; inset: 0;
  opacity: 0; pointer-events: none;
  transition: opacity .22s ease;
  overflow-y: auto;
  padding: 18px 20px 24px;
}
.screen.active { opacity: 1; pointer-events: all; }
.section-label {
  font-size: 10px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: .07em;
  margin-bottom: 10px;
}
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
  position: relative;
}
.kpi-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.kpi-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.kpi-name { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; }
.kpi-src { font-size: 9px; color: var(--text3); background: var(--surface2); padding: 2px 6px; border-radius: 4px; }
.kpi-value { font-size: 22px; font-weight: 600; color: var(--text); letter-spacing: -.03em; line-height: 1.1; margin-bottom: 6px; }
.kpi-sub { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 8px; }
.trend-up { color: var(--green); display: flex; align-items: center; gap: 3px; font-weight: 500; }
.trend-down { color: var(--red); display: flex; align-items: center; gap: 3px; font-weight: 500; }
.kpi-spark { height: 32px; width: 100%; }
.kpi-footer { display: flex; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--border); font-size: 10px; color: var(--text3); }
.health-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
.health-healthy { background: var(--green-bg); color: var(--green-txt); }
.health-warning { background: var(--amber-bg); color: var(--amber-txt); }
.health-critical { background: var(--red-bg); color: var(--red-txt); }
.exec-summary {
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
}
.exec-summary-icon { font-size: 28px; }
.exec-summary-content { flex: 1; }
.exec-summary-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.exec-summary-text { font-size: 13px; color: var(--text2); line-height: 1.5; }
.highlights-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.highlight-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.hl-icon { width: 30px; height: 30px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.hl-icon.success { background: var(--green-bg); }
.hl-icon.danger  { background: var(--red-bg); }
.hl-icon.warning { background: var(--amber-bg); }
.hl-icon.info    { background: var(--blue-bg); }
.hl-text { font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.4; }
.hl-sub  { font-size: 11px; color: var(--text2); margin-top: 2px; }
.charts-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.chart-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
}
.chart-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
.legend { display: flex; gap: 12px; margin-top: 8px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text2); }
.legend-dot  { width: 8px; height: 8px; border-radius: 50%; }

/* Workspace styles */
.workspace { display: grid; grid-template-columns: 65fr 35fr; gap: 14px; height: 100%; min-height: 0; }
.ws-left { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; }
.ws-right { display: flex; flex-direction: column; min-height: 0; }
.kpi-meta {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
}
.kpi-meta-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.kpi-meta-desc { font-size: 12px; color: var(--text2); margin-bottom: 12px; }
.sum-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 12px;
}
.sum-card {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.sum-lbl { font-size: 9px; font-weight: 600; color: var(--text3); text-transform: uppercase; margin-bottom: 5px; }
.sum-val { font-size: 17px; font-weight: 600; color: var(--text); }
.sum-val.up { color: var(--green); }
.sum-val.down { color: var(--red); }
.chart-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
}
.chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.chart-tabs { display: flex; gap: 4px; }
.c-tab {
  font-size: 11px; padding: 4px 11px;
  border-radius: 20px; border: 1px solid var(--border);
  cursor: pointer; color: var(--text2); background: transparent;
}
.c-tab.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue-txt); font-weight: 500; }
.drill-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
}
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { text-align: left; padding: 8px 10px; font-size: 10px; font-weight: 600; color: var(--text3); border-bottom: 1px solid var(--border2); }
.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
.data-table tr:hover td { background: var(--surface2); }
.badge { font-size: 10px; font-weight: 500; padding: 2px 6px; border-radius: 4px; display: inline-block; }
.badge.up { background: var(--green-bg); color: var(--green-txt); }
.badge.dn { background: var(--red-bg); color: var(--red-txt); }
.ai-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  display: flex; flex-direction: column;
  height: 100%;
  overflow: hidden;
}
.ai-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.ai-title { font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 7px; }
.ai-badge { font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 10px; background: var(--purple-bg); color: var(--purple-txt); }
.ai-ctx-chip { font-size: 11px; padding: 3px 10px; border: 1px solid var(--blue); border-radius: 20px; background: var(--blue-bg); color: var(--blue-txt); }
.ai-body { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.ai-textarea { width: 100%; font-size: 12px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface2); resize: none; font-family: var(--font); outline: none; }
.ai-textarea:focus { border-color: var(--blue); background: var(--surface); }
.ai-input-row { display: flex; gap: 6px; }
.ai-send { width: 34px; height: 34px; background: var(--blue); border: none; border-radius: var(--radius-sm); cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; }
.sq-label { font-size: 9px; font-weight: 600; color: var(--text3); text-transform: uppercase; margin-bottom: 6px; }
.sq-pill { font-size: 11px; padding: 6px 11px; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; background: var(--surface2); transition: all var(--transition); margin-bottom: 5px; }
.sq-pill:hover { border-color: var(--blue); background: var(--blue-bg); color: var(--blue-txt); }
.ai-response { background: var(--surface2); border-radius: var(--radius); padding: 11px 13px; font-size: 12px; line-height: 1.65; }
.insight-card { border-radius: var(--radius-sm); padding: 8px 11px; font-size: 12px; }
.insight-card.info { background: var(--blue-bg); color: var(--blue-txt); margin-top: 6px; }
.risk-item { display: flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: var(--radius-sm); background: var(--red-bg); color: var(--red-txt); font-size: 11px; margin-top: 6px; }
.kpi-catalog-toggle { position: fixed; bottom: 20px; left: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 30px; padding: 8px 16px; font-size: 12px; cursor: pointer; z-index: 200; box-shadow: var(--shadow); }
.kpi-catalog-panel { position: fixed; bottom: 70px; left: 20px; width: 240px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); z-index: 199; display: none; flex-direction: column; max-height: 400px; overflow-y: auto; }
.kpi-catalog-panel.open { display: flex; }
.catalog-group { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.catalog-group-title { font-weight: 600; font-size: 11px; color: var(--text3); margin-bottom: 6px; }
.catalog-item { padding: 6px 8px; font-size: 12px; cursor: pointer; border-radius: var(--radius-sm); }
.catalog-item:hover { background: var(--surface2); color: var(--blue); }
.modal-overlay { position: fixed; inset: 0; background: rgba(10,10,8,.5); display: flex; align-items: center; justify-content: center; z-index: 999; opacity: 0; pointer-events: none; backdrop-filter: blur(4px); }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border-radius: var(--radius-lg); width: 500px; max-width: calc(100vw - 32px); border: 1px solid var(--border); }
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff; padding: 10px 16px; border-radius: var(--radius); font-size: 12px; transform: translateY(20px); opacity: 0; transition: all .25s; z-index: 1000; }
.toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo"><div class="logo-mark"><span>BEV</span></div>Analytics</div>
      <div class="topbar-divider"></div>
      <nav class="breadcrumb" id="breadcrumb"><a onclick="showScreen('home')">Dashboard</a></nav>
    </div>
    <div class="topbar-right">
      <span class="refresh-time" id="live-time"></span>
      <button class="icon-btn" title="Notifications"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M8 1.5a4.5 4.5 0 0 0-4.5 4.5c0 2.2-.6 3.5-1.2 4.2-.3.4-.1.8.5.8h10.4c.6 0 .8-.4.5-.8-.6-.7-1.2-2-1.2-4.2A4.5 4.5 0 0 0 8 1.5Z"/><path d="M6.5 13.5a1.5 1.5 0 0 0 3 0"/></svg><span class="notif-dot"></span></button>
      <select id="role-switcher" class="role-selector" onchange="switchRole(this.value)">
        <option value="MD">👔 Managing Director</option>
        <option value="Finance">💰 Finance Manager</option>
        <option value="Operations">🏭 Operations Manager</option>
        <option value="HR">👥 HR Manager</option>
      </select>
      <div class="avatar">AK</div>
    </div>
  </header>
  <div class="filters-bar"><span class="filter-label">Filters</span><div class="chip active">FY 2024–25</div><div class="chip">All regions ▾</div><div class="chip">All departments ▾</div></div>
  <div class="screens">
    <div class="screen active" id="screen-home"></div>
    <div class="screen" id="screen-workspace">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div><span style="font-size:11px;color:var(--text3)">KPI workspace: </span><strong id="ws-kpi-name" style="font-size:14px">Revenue</strong></div>
        <button class="chip" onclick="showScreen('home')" style="background:var(--surface2)">← Back to Dashboard</button>
      </div>
      <div class="workspace" id="workspace-container"></div>
    </div>
  </div>
</div>
<div class="kpi-catalog-toggle" onclick="toggleCatalog()">📋 KPI Catalog</div>
<div class="kpi-catalog-panel" id="kpi-catalog"></div>
<div class="modal-overlay" id="export-modal"><div class="modal"><div class="modal-hdr" style="padding:16px"><span>Export</span><button onclick="closeExport()">✕</button></div><div class="modal-body" style="padding:16px"><p>Export simulation ready</p></div></div></div>
<div class="toast" id="toast"></div>

<script>
// ======================== ROLE CONFIGURATION ========================
const roleConfigs = {
  MD: {
    name: "Managing Director",
    kpis: ["Revenue", "Profit Margin", "Production", "Inventory", "Headcount", "Attrition"],
    highlights: ["🏆 Company Performance: Revenue +12.4%, Profit +1.3pp", "⚠️ Strategic Risks: Inventory turnover below threshold, Attrition spike", "📌 Executive Summary: Strong growth, monitor transformer category and engineering attrition."],
    execSummary: "Revenue increased 12.4% to ₹248.3 Cr. Profit margin improved 1.3pp to 18.7%. Production exceeded target by 8.1%. ⚠️ Inventory risk in South plant. 🔴 Attrition increased 3.2pp to 9.3%.",
    aiTitle: "Executive Analytics Assistant",
    questions: ["What are the top business risks?", "Compare performance across regions.", "What changed this quarter?", "Which KPIs require attention?"],

    aiTitle: "Finance Analytics Assistant",

    aiTitle: "Operations Analytics Assistant",
    questions: ["Which plant is underperforming?", "Show production bottlenecks.", "Compare planned vs actual output.", "Analyze machine downtime.", "Identify inventory risks."],
    insights: ["North plant achieved 102% utilization — best performance.", "West plant downtime increased 12% due to maintenance.", "Inventory slow-moving stock: ₹4.2 Cr ageing >90 days."],

  },
  HR: {
    name: "HR Manager",
    kpis: ["Headcount", "Attrition", "Hiring", "Training Hours", "Absenteeism", "Open Positions"],
    highlights: ["👥 Headcount up 42 net new hires", "📈 Attrition increased to 9.3%", "📚 Training hours per employee 24"],
    execSummary: "Headcount 1,284 (+42 net hires). 🔴 Attrition 9.3% (+3.2pp) — Engineering at 14%. ⚠️ Training hours 24/30 target. Open positions 18 (+50%). Absenteeism 4.1% above target.",
    aiTitle: "HR Analytics Assistant",
    questions: ["Why is attrition increasing?", "Compare departments by turnover.", "Show hiring effectiveness.", "Analyze workforce growth.", "Identify staffing risks."],
    insights: ["Engineering attrition at 14% — compensation gaps cited in 67% exit interviews.", "Time-to-fill at 38 days, above target of 30.", "Absenteeism rate 4.1% above industry norm."],
    risks: ["Open positions for key engineering roles (12 reqs)", "Attrition impact on production line efficiency"]
  }
};

const kpiMeta = {
  "Revenue": {current:"₹248.3 Cr", prev:"₹220.9 Cr", growth:"+12.4%", target:"₹240.0 Cr", health:"healthy", desc:"Total revenue from all business units."},

  "default": [{"dimension":"Category A","value":"45%","trend":"+5%","trendDir":"up"},{"dimension":"Category B","value":"32%","trend":"+2%","trendDir":"up"},{"dimension":"Category C","value":"23%","trend":"-3%","trendDir":"down"}]

let currentRole = "MD";
let currentKpi = "Revenue";

function getHealthIcon(health) {
  if(health === "healthy") return "🟢 Healthy";
  if(health === "warning") return "🟡 Warning";
  return "🔴 Critical";
}

function renderDashboard() {
  const cfg = roleConfigs[currentRole];
  const homeScreen = document.getElementById("screen-home");
  const kpisHtml = `<div class="exec-summary"><div class="exec-summary-icon">🧠</div><div class="exec-summary-content"><div class="exec-summary-title">AI Executive Summary · ${cfg.name}</div><div class="exec-summary-text">${cfg.execSummary}</div></div></div>
  <div class="section-label">Key performance indicators</div>
  <div class="kpi-grid" id="kpi-grid">${cfg.kpis.map(k => {
    const meta = kpiMeta[k] || {current:"—", growth:"0%", health:"warning", prev:"—", target:"—"};
    const healthClass = `health-${meta.health}`;
    return `<div class="kpi-card" onclick="showWorkspace('${k}')">
      <div class="kpi-card-header"><span class="kpi-name">${k}</span><span class="kpi-src">ERP</span></div>
      <div class="kpi-value">${meta.current}</div>
      <div class="kpi-sub"><span class="trend-${meta.growth.includes('+')?'up':'down'}">${meta.growth.includes('+')?'▲':'▼'} ${meta.growth}</span></div>
      <svg class="kpi-spark" viewBox="0 0 100 32"><polyline points="0,26 100,${meta.health==='healthy'?'8':'20'}" fill="none" stroke="${meta.health==='healthy'?'#1A7A45':'#B45309'}" stroke-width="1.8"/></svg>
      <div class="kpi-footer"><span class="health-badge ${healthClass}">${getHealthIcon(meta.health)}</span></div>
    </div>`;
  }).join('')}</div>
  <div class="section-label">Business highlights</div>
  <div class="highlights-grid">${cfg.highlights.map(h => `<div class="highlight-card"><div class="hl-icon info">📌</div><div><div class="hl-text">${h}</div></div></div>`).join('')}</div>
  <div class="section-label">Trend analysis</div>
  <div class="charts-row">
    <div class="chart-card"><div class="chart-title">Revenue Trend (Monthly)</div><svg viewBox="0 0 320 100" style="width:100%"><polyline points="0,75 40,65 80,70 120,55 160,48 200,42 240,38 280,28 320,18" fill="none" stroke="#1B5FCC" stroke-width="2"/><polyline points="0,72 40,68 80,67 120,65 160,64 200,62 240,61 280,60 320,58" fill="none" stroke="#C8C4BB" stroke-width="1.5" stroke-dasharray="4 3"/><text x="10" y="90" font-size="8" fill="#9A9690">Apr</text><text x="90" y="90" font-size="8" fill="#9A9690">Jul</text><text x="170" y="90" font-size="8" fill="#9A9690">Oct</text><text x="250" y="90" font-size="8" fill="#9A9690">Jan</text></svg><div class="legend"><div class="legend-item"><div class="legend-dot" style="background:#1B5FCC"></div>FY 2024–25</div><div class="legend-item"><div class="legend-dot" style="background:#C8C4BB"></div>FY 2023–24</div></div></div>
    <div class="chart-card"><div class="chart-title">Performance by Plant</div><svg viewBox="0 0 320 100" style="width:100%"><rect x="30" y="25" width="50" height="55" rx="4" fill="#1B5FCC" opacity=".85"/><rect x="120" y="40" width="50" height="40" rx="4" fill="#1A7A45" opacity=".8"/><rect x="210" y="50" width="50" height="30" rx="4" fill="#B45309" opacity=".8"/><text x="55" y="90" text-anchor="middle" font-size="9" fill="#5C5A55">North</text><text x="145" y="90" text-anchor="middle" font-size="9" fill="#5C5A55">South</text><text x="235" y="90" text-anchor="middle" font-size="9" fill="#5C5A55">West</text></svg><div class="legend"><div class="legend-item"><div class="legend-dot" style="background:#1B5FCC"></div>Actual</div><div class="legend-item"><div class="legend-dot" style="background:#C8C4BB"></div>Target</div></div></div>
  </div>`;
  homeScreen.innerHTML = kpisHtml;
}

function showWorkspace(kpi) {
  currentKpi = kpi;
  const meta = kpiMeta[kpi] || {current:"—", prev:"—", growth:"0%", target:"—", health:"warning", desc:"KPI performance data"};
  const cfg = roleConfigs[currentRole];
  const drillRows = drillData[kpi] || drillData.default;
  
  document.getElementById("ws-kpi-name").innerText = kpi;
  document.getElementById("breadcrumb").innerHTML = '<a onclick="showScreen(\'home\')">Dashboard</a> <span class="breadcrumb-sep">›</span> <span>' + kpi + '</span>';
  
  const workspaceHtml = `<div class="ws-left">
    <div class="kpi-meta">
      <div class="kpi-meta-title">${kpi}</div>
      <div class="kpi-meta-desc">${meta.desc || "Detailed performance analysis with trends and breakdowns."}</div>
      <div class="sum-row">
        <div class="sum-card"><div class="sum-lbl">Current</div><div class="sum-val">${meta.current}</div></div>
        <div class="sum-card"><div class="sum-lbl">Previous</div><div class="sum-val">${meta.prev}</div></div>
        <div class="sum-card"><div class="sum-lbl">Growth</div><div class="sum-val ${meta.growth.includes('+')?'up':'down'}">${meta.growth}</div></div>
        <div class="sum-card"><div class="sum-lbl">Target</div><div class="sum-val">${meta.target}</div></div>
      </div>
    </div>
    <div class="chart-container">
      <div class="chart-header"><div class="chart-title">${kpi} Trend</div><div class="chart-tabs"><div class="c-tab active" onclick="switchChartTab(this, 'trend')">Trend</div><div class="c-tab" onclick="switchChartTab(this, 'compare')">Comparison</div><div class="c-tab" onclick="switchChartTab(this, 'region')">By Region</div></div></div>
      <div id="chart-svg-container"><svg width="100%" viewBox="0 0 460 100" style="height:110px"><line x1="0" y1="25" x2="460" y2="25" stroke="#E8E6E0" stroke-width="0.5"/><line x1="0" y1="55" x2="460" y2="55" stroke="#E8E6E0" stroke-width="0.5"/><line x1="0" y1="85" x2="460" y2="85" stroke="#E8E6E0" stroke-width="0.5"/><polyline points="0,85 50,75 100,80 150,60 200,50 250,42 300,35 350,25 400,18 460,12" fill="none" stroke="#1B5FCC" stroke-width="2.2"/><polyline points="0,82 50,80 100,79 150,77 200,76 250,74 300,73 350,72 400,71 460,70" fill="none" stroke="#C8C4BB" stroke-width="1.5" stroke-dasharray="4 3"/></svg></div>
      <div class="legend"><div class="legend-item"><div class="legend-dot" style="background:#1B5FCC"></div>FY 2024–25</div><div class="legend-item"><div class="legend-dot" style="background:#C8C4BB"></div>FY 2023–24</div></div>
    </div>
    <div class="drill-container">
      <div class="section-label">Drill-down: ${kpi} breakdown</div>
      <table class="data-table"><thead><tr><th>Dimension</th><th>Value</th><th>Trend</th></tr></thead><tbody>${drillRows.map(r => `<tr><td>${r.dimension}</td><td><strong>${r.value}</strong></td><td><span class="badge ${r.trendDir === 'up' ? 'up' : 'dn'}">${r.trend.includes('+')?'▲':'▼'} ${r.trend}</span></td></tr>`).join('')}</tbody></table>
    </div>
  </div>
  <div class="ws-right">
    <div class="ai-panel">
      <div class="ai-header"><div class="ai-title">✨ ${cfg.aiTitle} <span class="ai-badge">AI</span></div><span class="ai-ctx-chip">${kpi}</span></div>
      <div class="ai-body">
        <div class="ai-input-row"><textarea id="ai-input" class="ai-textarea" rows="2" placeholder="Ask about ${kpi}..."></textarea><button class="ai-send" onclick="sendAiQuestion()">➤</button></div>
        <div><div class="sq-label">Suggested questions</div>${cfg.questions.map(q => `<div class="sq-pill" onclick="askQuestion('${q.replace(/'/g, "\\'")}')">${q}</div>`).join('')}</div>
        <div class="ai-response" id="ai-response-box"><strong>${kpi} analysis</strong><br>${cfg.insights.slice(0,2).join("<br>")}</div>
        <div class="sq-label">Risk indicators</div>${cfg.risks.map(r => `<div class="risk-item">⚠️ ${r}</div>`).join('')}
      </div>
    </div>
  </div>`;
  
  document.getElementById("workspace-container").innerHTML = workspaceHtml;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-workspace').classList.add('active');
}

function switchChartTab(tab, type) {
  const container = document.getElementById("chart-svg-container");
  if(type === 'trend') {
    container.innerHTML = `<svg width="100%" viewBox="0 0 460 100" style="height:110px"><line x1="0" y1="25" x2="460" y2="25" stroke="#E8E6E0" stroke-width="0.5"/><line x1="0" y1="55" x2="460" y2="55" stroke="#E8E6E0" stroke-width="0.5"/><line x1="0" y1="85" x2="460" y2="85" stroke="#E8E6E0" stroke-width="0.5"/><polyline points="0,85 50,75 100,80 150,60 200,50 250,42 300,35 350,25 400,18 460,12" fill="none" stroke="#1B5FCC" stroke-width="2.2"/><polyline points="0,82 50,80 100,79 150,77 200,76 250,74 300,73 350,72 400,71 460,70" fill="none" stroke="#C8C4BB" stroke-width="1.5" stroke-dasharray="4 3"/></svg>`;
  } else if(type === 'compare') {
    container.innerHTML = `<svg width="100%" viewBox="0 0 460 100" style="height:110px"><rect x="40" y="45" width="45" height="40" rx="3" fill="#1B5FCC" opacity=".8"/><rect x="115" y="30" width="45" height="55" rx="3" fill="#1A7A45" opacity=".8"/><rect x="190" y="55" width="45" height="30" rx="3" fill="#B45309" opacity=".8"/><rect x="265" y="20" width="45" height="65" rx="3" fill="#5B3FA8" opacity=".8"/><text x="62" y="95" text-anchor="middle" font-size="8">Q1</text><text x="137" y="95" text-anchor="middle" font-size="8">Q2</text><text x="212" y="95" text-anchor="middle" font-size="8">Q3</text><text x="287" y="95" text-anchor="middle" font-size="8">Q4</text></svg>`;
  } else {
    container.innerHTML = `<svg width="100%" viewBox="0 0 460 100" style="height:110px"><rect x="50" y="35" width="70" height="45" rx="4" fill="#1B5FCC" opacity=".85"/><rect x="150" y="50" width="70" height="30" rx="4" fill="#1A7A45" opacity=".8"/><rect x="250" y="60" width="70" height="20" rx="4" fill="#B45309" opacity=".8"/><text x="85" y="92" text-anchor="middle" font-size="9">South</text><text x="185" y="92" text-anchor="middle" font-size="9">North</text><text x="285" y="92" text-anchor="middle" font-size="9">West</text></svg>`;
  }
  tab.closest('.chart-tabs').querySelectorAll('.c-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
}

function showScreen(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${screen}`).classList.add('active');
  if(screen === 'home') {
    renderDashboard();
    document.getElementById("breadcrumb").innerHTML = '<a onclick="showScreen(\'home\')">Dashboard</a>';
  }
}

function switchRole(role) {
  currentRole = role;
  renderDashboard();
  showScreen('home');
  showToast(`Switched to ${roleConfigs[role].name} dashboard`);
}

function askQuestion(q) { 
  document.getElementById("ai-input").value = q; 
  sendAiQuestion(); 
}

function sendAiQuestion() { 
  const box = document.getElementById("ai-response-box"); 
  if(box) box.innerHTML = "✨ Analyzing based on " + currentKpi + " data...<br><br>According to current trends, " + currentKpi + " shows " + (kpiMeta[currentKpi]?.growth || "stable") + " performance versus targets."; 
  showToast("AI insight updated for " + currentKpi); 
}

function showToast(msg) { 
  const t = document.getElementById("toast"); 
  t.innerText = "✓ " + msg; 
  t.classList.add("show"); 
  setTimeout(() => t.classList.remove("show"), 2000); 
}

function toggleCatalog() { 
  const panel = document.getElementById("kpi-catalog"); 
  panel.classList.toggle("open"); 
  if(panel.classList.contains("open")){ 
    panel.innerHTML = `<div class="catalog-group"><div class="catalog-group-title">Finance</div><div class="catalog-item" onclick="showWorkspace('Revenue')">💰 Revenue</div><div class="catalog-item" onclick="showWorkspace('Profit Margin')">📈 Profit Margin</div><div class="catalog-item" onclick="showWorkspace('Cash Flow')">💵 Cash Flow</div></div>
    <div class="catalog-group"><div class="catalog-group-title">Operations</div><div class="catalog-item" onclick="showWorkspace('Production Output')">🏭 Production</div><div class="catalog-item" onclick="showWorkspace('Inventory')">📦 Inventory</div><div class="catalog-item" onclick="showWorkspace('Machine Utilization')">⚙️ Utilization</div></div>
    <div class="catalog-group"><div class="catalog-group-title">HR</div><div class="catalog-item" onclick="showWorkspace('Headcount')">👥 Headcount</div><div class="catalog-item" onclick="showWorkspace('Attrition')">⚠️ Attrition</div><div class="catalog-item" onclick="showWorkspace('Open Positions')">📋 Open Positions</div></div>`; 
  } 
}

function closeExport() { document.querySelector(".modal-overlay").classList.remove("open"); }
function updateClock() { document.getElementById("live-time").innerText = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
setInterval(updateClock,1000); 
updateClock();
renderDashboard();
</script>
</body>
</html>
